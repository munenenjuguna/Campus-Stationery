<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CampusStationery</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- SHARED HEADER (filled in by js/layout.js) -->
    <div id="siteHeader"></div>


    <!-- RESET PASSWORD -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">

                <div class="auth-heading">
                    <a href="../index.html" class="auth-logo">CampusStationery.</a>
                    <h1>Choose a New Password</h1>
                    <p>Pick a password you have not used here before.</p>
                </div>

                <form id="resetForm" novalidate>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" id="newPassword" placeholder="At least 8 characters"
                                autocomplete="new-password" required>
                            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <small class="password-hint">Use at least 8 characters, with letters and numbers.</small>
                        <div class="invalid-feedback d-block" id="newPasswordError"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" id="confirmNewPassword" placeholder="Type the new password again"
                                autocomplete="new-password" required>
                            <button type="button" class="password-toggle" data-target="confirmNewPassword" aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback d-block" id="confirmNewPasswordError"></div>
                    </div>

                    <div id="resetMessage" class="auth-message" role="alert"></div>

                    <button type="submit" class="btn btn-primary w-100 auth-button">
                        Save New Password <i class="bi bi-check2"></i>
                    </button>
                </form>

                <p class="auth-footer"><a href="forgot-password.html">Request a new link</a> &middot; <a href="login.html">Back to login</a></p>
            </div>
        </div>
    </section>


    <!-- SHARED FOOTER (filled in by js/layout.js) -->
    <div id="siteFooter"></div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared helpers, header and footer -->
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/password.js"></script>

</body>
</html>
