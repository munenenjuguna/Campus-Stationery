<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CampusStationery</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- SHARED HEADER (filled in by js/layout.js) -->
    <div id="siteHeader"></div>


    <!-- FORGOT PASSWORD -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">

                <div class="auth-heading">
                    <a href="../index.html" class="auth-logo">CampusStationery.</a>
                    <h1>Forgot Password?</h1>
                    <p>Enter the email you registered with and we will send you a link to choose a new password.</p>
                </div>

                <form id="forgotForm" novalidate>
                    <div class="mb-3">
                        <label for="forgotEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="forgotEmail" placeholder="Enter your email address"
                            autocomplete="email" required autofocus>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div id="forgotMessage" class="auth-message" role="alert"></div>

                    <button type="submit" class="btn btn-primary w-100 auth-button">
                        Send Reset Link <i class="bi bi-envelope"></i>
                    </button>
                </form>

                <p class="auth-footer">Remembered it? <a href="login.html">Back to login</a></p>
            </div>
        </div>
    </section>


    <!-- SHARED FOOTER (filled in by js/layout.js) -->
    <div id="siteFooter"></div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared helpers, header and footer -->
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/password.js"></script>

</body>
</html>
