<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | CampusStationery</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- SHARED HEADER (filled in by js/layout.js) -->
    <div id="siteHeader"></div>


    <!-- PAGE HEADER -->

    <section class="catalog-header">

        <div class="container">

            <span class="section-label">EXPLORE OUR COLLECTION</span>

            <h1>Find Your Essentials.</h1>

            <p>
                Everything you need for your academic journey,
                all in one place.
            </p>

            <div class="catalog-breadcrumb">
                <a href="../index.html">Home</a>
                <i class="bi bi-chevron-right"></i>
                <span>Shop</span>
            </div>

        </div>

    </section>


    <!-- PRODUCT CATALOG -->

    <section class="catalog-section">

        <div class="container">

            <div class="row g-4">

                <!-- SIDEBAR -->

                <div class="col-lg-3">

                    <div class="filter-sidebar">

                        <h5>Filters</h5>

                        <hr>

                        <h6>Categories</h6>

                        <div class="category-filter">

                            <label>
                                <input type="radio" name="category" value="all" checked>
                                All Products
                            </label>

                            <label>
                                <input type="radio" name="category" value="notebooks">
                                Notebooks
                            </label>

                            <label>
                                <input type="radio" name="category" value="writing">
                                Writing Materials
                            </label>

                            <label>
                                <input type="radio" name="category" value="calculators">
                                Calculators
                            </label>

                            <label>
                                <input type="radio" name="category" value="paper">
                                Paper Products
                            </label>

                            <label>
                                <input type="radio" name="category" value="accessories">
                                Accessories
                            </label>

                        </div>

                        <hr>

                        <h6>Maximum Price</h6>

                        <select id="priceFilter" class="form-select">
                            <option value="all">Any Price</option>
                            <option value="200">Under KSh 200</option>
                            <option value="500">Under KSh 500</option>
                            <option value="1000">Under KSh 1,000</option>
                            <option value="2000">Under KSh 2,000</option>
                        </select>

                        <hr>

                        <button class="reset-filter" id="resetFilters">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Reset Filters
                        </button>

                    </div>

                </div>


                <!-- PRODUCTS AREA -->

                <div class="col-lg-9">

                    <!-- SEARCH AND SORT -->

                    <div class="catalog-toolbar">

                        <div class="search-box">

                            <i class="bi bi-search"></i>

                            <input type="text" id="productSearch"
                                placeholder="Search for notebooks, pens, calculators...">

                        </div>

                        <select id="sortProducts" class="form-select sort-select">

                            <option value="default">Sort By: Featured</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                            <option value="name">Name: A to Z</option>

                        </select>

                    </div>


                    <!-- PRODUCT COUNT -->

                    <div class="results-info">

                        <p>
                            Showing <strong id="productCount">0</strong> products
                        </p>

                    </div>


                    <!-- PRODUCTS WILL BE INSERTED HERE -->

                    <div class="row g-4" id="productContainer">

                    </div>


                    <!-- EMPTY STATE -->

                    <div class="empty-state" id="emptyState" style="display: none;">

                        <i class="bi bi-search"></i>

                        <h4>No products found</h4>

                        <p>Try changing your search or filters.</p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- SHARED FOOTER (filled in by js/layout.js) -->
    <div id="siteFooter"></div>


    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared helpers, header and footer -->
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/products.js"></script>

</body>

</html>
